<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101b3f, #176b87);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 35px #0003;
    }
    h1 { color: #12345a; font-size: 25px; text-align: center; }
    p { color: #555; text-align: center; }
    label { display: block; margin: 15px 0 7px; font-weight: bold; }
    select, input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    select, input { border: 1px solid #bbb; }
    button {
      margin-top: 20px;
      background: #1266d5;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:hover { background: #084da8; }
    #message { color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>AI Smart Attendance</h1>
    <p>College Attendance Management System</p>

    <form id="loginForm">
      <label for="role">Login As</label>
      <select id="role" required>
        <option value="student">Student</option>
        <option value="staff">Staff</option>
      </select>

      <label for="userId">User ID</label>
      <input id="userId" type="text" placeholder="Enter your User ID" required>

      <button type="submit">Continue</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const role = document.getElementById("role").value;
      const userId = document.getElementById("userId").value.trim();

      if (!userId) return;

      document.getElementById("message").textContent =
        "Login page ready. Database authentication will be added in the next part.";
    });
  </script>
</body>
</html>
