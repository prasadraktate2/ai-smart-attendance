<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance System</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #173b76;
      color: white;
      text-align: center;
      padding: 18px 12px;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 12px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      background: #2059a8;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 10px;
      border-radius: 7px;
      margin: 10px 0;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<header>
  <h1>AI Smart Attendance System</h1>
  <p>QR Code Based Lecture Attendance</p>
</header>

<main>
  <section id="loginPanel" class="card">
    <h2>Login</h2>
  </section>
</main>

</body>
</html>
